# harness: Secret 탐지 (gitleaks)
#
# MR에 들어온 커밋 전체(기준 커밋..소스 브랜치 커밋)의 패치를 검사한다. 뒤 커밋에서 지운 Secret도
# 이력에 남으므로 잡는다. merge 커밋에서 충돌을 풀며 넣은 내용도 본다(`--remerge-diff`).
# 발견하면 job이 실패한다. 로그와 리포트에는 값을 가려서(redact) 남긴다.
#
# 범위를 확정하지 못하면(MR 변수 없음, 얕은 clone, 커밋 없음) 검사하지 않고 실패한다. gitleaks는
# git 범위 오류에도 "no leaks found"로 끝나므로 먼저 확인한다.
#
# 사용법:
#   include:
#     - remote: https://raw.githubusercontent.com/kiddo-psh/ai-dev-harness/<tag>/core/ci/gitlab/secret-detection.yml
#
# 변수: 없음. `stage`·`image` 등은 같은 이름의 job을 로컬에 다시 적어 덮어쓴다. `GIT_DEPTH`는 0이어야 한다.
# 필요 조건: Docker executor runner, Docker Hub 접근.
# 예외: 저장소 루트의 `.gitleaksignore`(리포트의 Fingerprint 한 줄씩). 규칙 조정은 `.gitleaks.toml`이며
#       `[extend]`에 `useDefault = true`가 없으면 기본 규칙이 꺼지므로 실패한다.
#       이 MR이 예외 파일을 바꿨으면 로그 맨 앞에 경고로 보인다. 실제 Secret은 예외로 넘기지 말고 폐기·교체한다.
# 한계: 커밋 메시지와 바이너리 파일은 보지 않는다.
# 리포트: gitleaks-report.json (redact됨, 30일 보관)

harness-secret-detection:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  interruptible: true
  script:
    - |
      set -eu
      fail() { echo "harness: $*"; exit 2; }
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      base=${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}
      head=${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-${CI_COMMIT_SHA:-}}  # merged results면 대상 브랜치 커밋을 빼고 소스만 본다
      if [ -z "$base" ] || [ -z "$head" ]; then fail "MR 기준·대상 커밋 변수가 비어 있어 범위를 정할 수 없다."; fi
      if [ "$(git rev-parse --is-shallow-repository)" != false ]; then fail "얕은 clone이다. GIT_DEPTH가 0인지 확인한다."; fi
      git cat-file -e "$base^{commit}" 2>/dev/null || fail "기준 커밋 $base 이 저장소에 없다."
      git cat-file -e "$head^{commit}" 2>/dev/null || fail "대상 커밋 $head 이 저장소에 없다."
      git merge-base --is-ancestor "$base" "$head" || fail "기준 커밋이 대상 커밋의 조상이 아니다."
      if [ -n "${GITLEAKS_CONFIG_TOML:-}" ]; then fail "GITLEAKS_CONFIG_TOML은 쓰지 않는다. 저장소의 .gitleaks.toml로 조정한다."; fi
      config=${GITLEAKS_CONFIG:-.gitleaks.toml}
      if [ -f "$config" ] && ! awk '
        /^[[:space:]]*\[extend\][[:space:]]*(#.*)?$/ { in_extend=1; next }
        /^[[:space:]]*\[/ { in_extend=0 }
        in_extend && /^[[:space:]]*useDefault[[:space:]]*=[[:space:]]*true[[:space:]]*(#.*)?$/ { found=1 }
        END { exit !found }
      ' "$config"; then
        fail "$config 의 [extend]에 useDefault = true가 없어 기본 규칙이 꺼진다."
      fi
      changed=$(git diff --name-only "$base" "$head" -- .gitleaksignore .gitleaks.toml "$config")
      if [ -n "$changed" ]; then echo "harness 경고: 이 MR이 Secret 탐지 예외·설정 파일을 바꿨다. 리뷰에서 확인한다."; echo "$changed"; fi
      gitleaks git --no-banner --redact \
        --log-opts="--remerge-diff $base..$head" \
        --report-format json --report-path gitleaks-report.json \
        --exit-code 1 .
      if [ ! -f gitleaks-report.json ]; then fail "리포트가 만들어지지 않았다. 검사가 끝나지 않았다."; fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - gitleaks-report.json
